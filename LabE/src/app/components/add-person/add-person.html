<mat-card class="person-card">
  <h2>Add Person</h2>
  <form (ngSubmit)="save()">

    <div class="personal-info">
      <mat-form-field appearance="fill">
        <mat-label>Name</mat-label>
        <input matInput [(ngModel)]="person.firstName" name="firstName">
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Prename</mat-label>
        <input matInput [(ngModel)]="person.familyName" name="familyName">
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Age</mat-label>
        <input matInput type="number" [(ngModel)]="person.age" name="age">
      </mat-form-field>
    </div>
    <mat-card class="address-card">
      <h3>Address</h3>

      <mat-form-field appearance="outline" class="form-field">
        <mat-label>City</mat-label>
        <input matInput [(ngModel)]="person.address.city" name="city">
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Street</mat-label>
        <input matInput [(ngModel)]="person.address.street" name="street">
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Mail code</mat-label>
        <input matInput [(ngModel)]="person.address.postCode" name="postCode">
      </mat-form-field>
    </mat-card>

    <button mat-raised-button color="primary" class="save-btn" type="submit">Save</button>
  </form>
</mat-card>
