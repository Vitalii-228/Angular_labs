<ng-container *ngIf="person; else nf">
  <mat-card class="person-details-card">
    <mat-card-header>
      <mat-card-title>{{ person.firstName }} {{ person.familyName }}</mat-card-title>
      <mat-card-subtitle>Age: {{ person.age }}</mat-card-subtitle>
    </mat-card-header>

    <mat-divider></mat-divider>

    <mat-card-content>
      <h3>Address</h3>
      <p>City: {{ person.address.city }}</p>
      <p>Street: {{ person.address.street }}</p>
      <p>Mail code: {{ person.address.postCode }}</p>
    </mat-card-content>
  </mat-card>
</ng-container>

<ng-template #nf>
  <mat-card class="not-found-card">
    <p>Person not found</p>
  </mat-card>
</ng-template>
